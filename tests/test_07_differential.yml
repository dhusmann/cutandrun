- name: test_differential_summary_preserves_skip
  command: bash -c "mkdir -p tests/output/summary_override && printf '%b' 'group\tcaller\ttreated_condition\tcontrol_condition\tstatus\treason\nh3k27me3\tNA\tTreatment\tControl\tSKIP\tmanual_skip\n' > tests/output/summary_override/design.tsv && printf '%b' 'group\tcaller\ttreated\tcontrol\tn_bins_tested\tn_fdr_pass\tn_up\tn_down\tn_clusters\tchosen_minPts\tchosen_minSamps\tstatus\treason\tenrichment_status\nh3k27me3\tNA\tTreatment\tControl\t10\t1\t1\t0\t2\t100\t100\tRUN\tok\tNOT_RUN\n' > tests/output/summary_override/chipbinner.summary.tsv && python3 bin/differential_summary.py --design tests/output/summary_override/design.tsv --summaries tests/output/summary_override/chipbinner.summary.tsv --out tests/output/summary_override/summary.tsv"
  tags:
    - test_differential
    - test_differential_summary
  files:
    - path: tests/output/summary_override/summary.tsv
      contains:
        - "SKIP"
        - "manual_skip"

- name: test_differential_manifests_deterministic
  command: bash -c "rm -rf tests/output/manifest_run1 tests/output/manifest_run2 && mkdir -p tests/output/manifest_run1 tests/output/manifest_run2 && python3 bin/differential_manifests.py --samples tests/assets/differential_manifest_input/samples.tsv --peaks tests/assets/differential_manifest_input/peaks.tsv --normalisation-mode NA --outdir tests/output/manifest_run1 && python3 bin/differential_manifests.py --samples tests/assets/differential_manifest_input/samples.tsv --peaks tests/assets/differential_manifest_input/peaks.tsv --normalisation-mode NA --outdir tests/output/manifest_run2 && diff -q tests/output/manifest_run1/differential_manifest.samples.tsv tests/output/manifest_run2/differential_manifest.samples.tsv && diff -q tests/output/manifest_run1/differential_manifest.peaks.tsv tests/output/manifest_run2/differential_manifest.peaks.tsv"
